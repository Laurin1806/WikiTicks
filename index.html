<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WikiTicks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Jost:wght@400;500;600&display=swap">
<style>
/* Farbvariablen registriert, damit der Tag/Nacht-Wechsel die Farben selbst überblendet: alle Elemente ändern sich gleichzeitig */
@property --bg { syntax: "<color>"; inherits: true; initial-value: #f6f7f9; }
@property --surface { syntax: "<color>"; inherits: true; initial-value: #ffffff; }
@property --fg { syntax: "<color>"; inherits: true; initial-value: #16202c; }
@property --muted { syntax: "<color>"; inherits: true; initial-value: #5b6676; }
@property --line { syntax: "<color>"; inherits: true; initial-value: #dde2ea; }
@property --accent { syntax: "<color>"; inherits: true; initial-value: #1f4fa0; }
@property --accent-soft { syntax: "<color>"; inherits: true; initial-value: #e6edf8; }
@property --gold { syntax: "<color>"; inherits: true; initial-value: #9a6f22; }
@property --gl { syntax: "<number>"; inherits: true; initial-value: 0; } /* Stärke des Nacht-Glühens 0–1, wird beim Umschalten mit den Farben animiert */

/* Layout: Kopfzeile mit laufendem Zifferblatt; links gegliederte Navigation (Uhrenmodelle / Lexikon), rechts die Ansicht */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --fg: #16202c;
  --muted: #5b6676;
  --line: #dde2ea;
  --accent: #1f4fa0;      /* gebläuter Stahl */
  --accent-soft: #e6edf8;
  --gold: #9a6f22;
  --font-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --font-logo: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --surface: #151c26; --fg: #e6ebf2; --muted: #95a1b2;
    --line: #263142; --accent: #7da6ec; --accent-soft: #1b2a42; --gold: #d4a856;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #151c26; --fg: #e6ebf2; --muted: #95a1b2;
  --line: #263142; --accent: #7da6ec; --accent-soft: #1b2a42; --gold: #d4a856;
  color-scheme: dark;
}
/* Akzentfarbe Dunkelgrün (per Umschalter) */
:root[data-accent="green"] { --accent: #1d5c42; --accent-soft: #e1eee6; }
@media (prefers-color-scheme: dark) {
  :root[data-accent="green"]:not([data-theme="light"]) { --accent: #6cc39a; --accent-soft: #16302a; }
}
:root[data-theme="dark"][data-accent="green"] { --accent: #6cc39a; --accent-soft: #16302a; }
/* Bordeaux */
:root[data-accent="bordeaux"] { --accent: #7a1f33; --accent-soft: #f4e4e8; }
@media (prefers-color-scheme: dark) {
  :root[data-accent="bordeaux"]:not([data-theme="light"]) { --accent: #e58fa1; --accent-soft: #3a1c24; }
}
:root[data-theme="dark"][data-accent="bordeaux"] { --accent: #e58fa1; --accent-soft: #3a1c24; }
/* Anthrazit */
:root[data-accent="anthrazit"] { --accent: #3a4048; --accent-soft: #e7e9ec; }
@media (prefers-color-scheme: dark) {
  :root[data-accent="anthrazit"]:not([data-theme="light"]) { --accent: #bcc4ce; --accent-soft: #252c35; }
}
:root[data-theme="dark"][data-accent="anthrazit"] { --accent: #bcc4ce; --accent-soft: #252c35; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap {
  max-width: 1320px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 1000px) { .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }

/* Kopf */
header { border-bottom: 1px solid var(--line); }
.head { display: flex; align-items: center; gap: 28px; padding-block: 32px 26px; }
.dial { flex: none; width: 108px; height: 108px; }
/* Leuchtmasse auf den Zeigern der kleinen Uhr: nur im Nachtmodus, mit sanftem Glühen */
.dial .dlume { stroke: #eceff2; transition: stroke 1.1s ease-in-out, fill 1.1s ease-in-out, filter 1.1s ease-in-out; }
.dial .dlume-dot { fill: #eceff2; stroke: var(--accent); }
:root.night .dial .dlume { stroke: #b4ffd2; }
:root.night .dial .dlume-dot { fill: #b4ffd2; stroke: var(--accent); }
:root.night .dial [data-hand="h"] line:first-child, :root.night .dial [data-hand="m"] line:first-child { stroke: #6f7986; }
:root.night .dial .dlume { filter: url(#dglow); } /* SVG-Filter: funktioniert auch in Safari */
.head h1 { font-family: var(--font-logo); font-weight: 800; font-size: clamp(2.1rem, 5vw, 3.1rem); line-height: 1; margin: 0; letter-spacing: -.03em; }
.head h1 a { color: inherit; text-decoration: none; }
.head h1 em { color: var(--accent); font-style: normal; font-weight: 700; filter: saturate(calc(1 + var(--gl) * .35)) brightness(calc(1 + var(--gl) * .04)); } /* nachts kräftigere Farbe */
/* Nachtmodus: »Ticks« im Logo leuchtet, farbige Überschriften und farbiger Text glühen leicht (Stärke über --gl, läuft synchron mit dem Farbwechsel) */
:root { --gl: 0; }
:root.night { --gl: 1; }
.head h1 em { text-shadow: 0 0 1px color-mix(in srgb, var(--accent) calc(var(--gl) * 100%), var(--bg)), 0 0 5px color-mix(in srgb, var(--accent) calc(var(--gl) * 100%), var(--bg)), 0 0 12px color-mix(in srgb, var(--accent) calc(var(--gl) * 80%), var(--bg)), 0 0 24px color-mix(in srgb, var(--accent) calc(var(--gl) * 60%), var(--bg)), 0 0 44px color-mix(in srgb, var(--accent) calc(var(--gl) * 40%), var(--bg)); } /* gleiche Farbe wie der gewählte Menüpunkt (Akzentfarbe), kräftigeres Leuchten */
a.xl, .crumbs a, nav a.more, #minipanel a.more, .daily .kicker, .fcard .kicker, .timeline .ty, .curbox .label, .rel a, .toc button, .pc-table summary, .lexbtn span, .imgnote summary, .mpinfo .mpk { text-shadow: 0 0 7px color-mix(in srgb, var(--accent) calc(var(--gl) * 45%), var(--bg)); }
.card .cat, article .cat, .mlist li small, .azgroup li small { text-shadow: 0 0 7px color-mix(in srgb, var(--gold) calc(var(--gl) * 45%), var(--bg)); }
.azgroup > h3 { text-shadow: 0 0 12px color-mix(in srgb, var(--accent) calc(var(--gl) * 45%), var(--bg)); }
.head p { margin: 8px 0 0; color: var(--muted); max-width: 56ch; }
.beat { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-top: 6px; }
.accent-box { margin-top: 28px; padding: 18px 0 0 10px; border-top: 1px solid var(--line); }
.accent-box .label { margin-bottom: 8px; }
.accent-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); max-width: 260px; }
.accent-switch button { display: flex; align-items: center; gap: 7px; font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; border-radius: 999px; padding: 5px 12px 5px 8px; cursor: pointer; }
.accent-switch button[aria-pressed="true"] { background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.accent-switch i { width: 14px; height: 14px; border-radius: 50%; display: block; }
.accent-switch .sw-blue { background: #1f4fa0; }
.accent-switch .sw-green { background: #1d5c42; }
.accent-switch .sw-bordeaux { background: #7a1f33; }
.accent-switch .sw-anthrazit { background: #3a4048; }
@media (max-width: 760px) { .accent-box { display: none; margin-top: 0; padding: 14px 4px 4px; } nav.open ~ .accent-box { display: block; } }
.search { position: relative; margin-top: 16px; max-width: 480px; }
.search input { width: 100%; font: inherit; padding: 12px 16px 12px 42px; border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.04); background: var(--surface); color: var(--fg); }
.search input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }

/* Navigation */
main { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 52px; padding-block: 30px 56px; }
.menu-toggle { display: none; }
/* Kompakte Menüleiste: erscheint oben fest, sobald das Menü aus dem Bild gescrollt ist; klappt nach unten auf */
#minibar { position: fixed; top: 10px; max-width: 560px; left: 50%; transform: translate(-50%, -140%); width: min(560px, calc(100% - 24px)); z-index: 900; transition: transform .25s ease; }
#minibar.on { transform: translate(-50%, 0); }
#minibar .menu-toggle.mini { display: flex; justify-content: space-between; align-items: center; width: 100%; font: inherit; font-weight: 600; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: var(--fg); cursor: pointer; box-shadow: 0 6px 24px rgba(0, 0, 0, .12); }
#minibar .menu-toggle.mini span { color: var(--muted); font-weight: 400; }
#minipanel { display: grid; grid-template-columns: minmax(0, 1fr); gap: 18px; margin-top: 6px; max-height: 0; overflow: hidden; padding: 0 8px; opacity: 0; transform: translateY(-8px); transition: max-height .35s ease, padding .35s ease, opacity .25s ease, transform .35s ease; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 10px 30px rgba(0, 0, 0, .16); }
#minibar.open #minipanel { max-height: min(78vh, 640px); overflow-x: hidden; overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain; padding: 14px 12px; opacity: 1; transform: none; }
#minipanel .mshome { display: grid; grid-template-columns: 1fr auto; align-items: center; column-gap: 6px; }
#minipanel .mslupe { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); color: var(--muted); cursor: pointer; transition: color .2s, border-color .2s; }
#minipanel .msopen .mslupe { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
#minipanel .mslupe svg { filter: drop-shadow(0 0 3px color-mix(in srgb, var(--accent) calc(var(--gl) * 50%), transparent)); }
#minipanel .mssearch { grid-column: 1 / -1; max-height: 0; overflow: hidden; opacity: 0; transition: max-height .3s ease, opacity .25s ease, margin .3s ease; }
#minipanel .msopen .mssearch { max-height: 70px; opacity: 1; margin-top: 5px; }
#minipanel .mssearch { padding: 4px; margin-inline: -4px; } /* Platz für den Fokusring an den runden Ecken */
#minipanel .mssearch input { width: 100%; font: inherit; font-size: 16px; padding: 9px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); }
#minipanel .mssearch input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
#minipanel .mininight { border-top: 1px solid var(--line); padding: 14px 6px 2px; display: grid; gap: 12px; }
@media (min-width: 761px) { #minibar { transform: translateY(-140%); } #minibar.on { transform: none; } }
@media (max-width: 760px) { #minibar.open #minipanel { max-height: 50vh; } }
@media (prefers-reduced-motion: reduce) { #minibar, #minipanel { transition: none; } }
#minipanel .navgroup h2 {font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; margin: 0 0 6px; padding-left: 10px; }
#minipanel ul {list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
#minipanel a {display: block; color: var(--fg); text-decoration: none; padding: 6px 10px; border-radius: 6px; font-size: 14.5px; }
#minipanel a:hover {background: var(--accent-soft); }
#minipanel a.sub {padding-left: 22px; color: var(--muted); color: color-mix(in srgb, var(--fg) 70%, var(--bg)); font-size: 14px; }
#minipanel a.sub[aria-current="true"] {color: #fff; }
#minipanel a[aria-current="true"] { background: var(--accent); color: #fff; }
#minipanel a.home {font-weight: 600; }
#minipanel a.more {color: var(--accent); font-weight: 500; }
#minipanel a[aria-current="true"] {box-shadow: 0 0 12px color-mix(in srgb, var(--accent) calc(var(--gl) * 60%), var(--bg)), 0 0 28px color-mix(in srgb, var(--accent) calc(var(--gl) * 25%), var(--bg)); }
:root.night #minipanel a:hover {box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 35%, transparent); }
nav { display: grid; gap: 22px; align-content: start; }
.navgroup h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; margin: 0 0 6px; padding-left: 10px; }
nav ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
nav a { display: block; color: var(--fg); text-decoration: none; padding: 6px 10px; border-radius: 6px; font-size: 14.5px; }
nav a:hover { background: var(--accent-soft); }
nav a[aria-current="true"] { background: var(--accent); color: #fff; } /* Schrift bleibt weiß: kein Verschwinden beim Umschalten */
nav a.sub { padding-left: 22px; color: var(--muted); color: color-mix(in srgb, var(--fg) 70%, var(--bg)); font-size: 14px; }
nav a.sub[aria-current="true"] { color: #fff; }
nav a.home { font-weight: 600; }
nav a.more { color: var(--accent); font-weight: 500; }

/* Allgemeine Bausteine */
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; margin: 0 0 10px; }
.crumbs { font-size: 13px; color: var(--muted); margin-bottom: 18px; display: flex; flex-wrap: wrap; gap: 4px 8px; }
.crumbs a { color: var(--accent); text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.crumbs span[aria-hidden] { opacity: .6; }
.page-title { font-family: var(--font-display); font-weight: 400; font-size: clamp(2.2rem, 5vw, 3rem); line-height: 1.05; margin: 0 0 10px; text-wrap: balance; }
.intro { color: var(--muted); max-width: 64ch; margin: 0 0 22px; }
.count { color: var(--muted); margin: 0 0 16px; font-size: 13px; }
.section-title { font-family: var(--font-logo); font-weight: 500; font-size: 1.55rem; line-height: 1.15; letter-spacing: -.02em; margin: 0 0 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.grid + .label { margin-top: 26px; }
.card { display: flex; flex-direction: column; gap: 6px; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
.card { transition: box-shadow .25s ease, border-color .25s ease, transform .2s ease; }
.card:hover, .card:active { border-color: var(--accent); transform: translateY(-1px); box-shadow: 0 0 0 1px color-mix(in srgb, var(--accent) 35%, transparent), 0 0 14px color-mix(in srgb, var(--accent) 18%, transparent); }
.card .cat { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--gold); font-weight: 600; }
.card h3 { font-family: var(--font-display); font-weight: 400; font-size: 1.55rem; line-height: 1.15; margin: 0; }
.card p { margin: 0; color: var(--muted); font-size: 14px; }
.empty { padding: 30px 0; color: var(--muted); }

/* Artikel */
article { max-width: calc(70ch + 360px); }
article > :not(.topfig) { max-width: 70ch; }
/* Erstes Bild oben rechts, Text fließt links daneben */
article .topfig { float: right; width: 320px; margin: 4px 0 20px 36px; }
article .topfig.watchfig .watch { height: 280px; }
article .topfig .watchfig { margin: 0; }
article .lexfig.topfig { width: 380px; }
article .lexfig.dgfig { max-width: 760px; margin: 14px 0 26px; }
article .lexfig.dgfig .diagram { padding: 22px 24px 16px; }
article .topfig figcaption b { display: block; }
article .gallery-inline, article .refs-wrap, article .curbox, article .timeline { clear: right; }
/* Bilder zwischen den Absätzen: rechts neben dem passenden Absatz, Text fließt daneben */
article .inlinefig { width: 250px; margin: 6px 0 14px 28px; float: right; clear: right; }
article .inlinefig .watchfig { margin: 0; padding: 14px 10px 12px; }
article .inlinefig .watchfig .watch { height: 220px; }
article .inlinefig figcaption b { display: block; }
/* Unterüberschriften innerhalb eines Abschnitts (optional, Feld bh je Absatz) */
article h4.art-sh { font-family: inherit; font-weight: 600; font-size: 1.06rem; letter-spacing: -.005em; line-height: 1.3; margin: 24px 0 6px; color: var(--fg); }
article h3.art-h + h4.art-sh { margin-top: 10px; }
@media (max-width: 760px) { article .inlinefig { float: none; width: auto; margin: 10px 0 16px; } }
@media (max-width: 1100px) { article .topfig { width: 260px; margin-left: 24px; } article .topfig.watchfig .watch { height: 230px; } }
@media (max-width: 760px) {
  article .topfig { float: none; width: auto; margin: 6px 0 20px; }
  /* Handy: Bild unter Überschrift und Kurzbeschreibung */
  article { display: flex; flex-direction: column; }
  article > * { order: 6; min-width: 0; max-width: 100%; }
  article > .cat { order: 1; } article > h2 { order: 2; } article > .meta { order: 3; } article > .lead { order: 4; } article > .topfig { order: 5; } article > .dgfig { order: 5; margin: 6px 0 20px; }
}
article .cat { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--gold); font-weight: 600; }
article h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2.2rem, 5vw, 3rem); line-height: 1.05; margin: 6px 0 12px; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 0 0 16px; font-size: 13px; color: var(--muted); }
.meta b, .meta a { color: var(--fg); font-weight: 600; }
article .lead { font-size: 1.15rem; margin: 0 0 22px; }
article p { margin: 0 0 14px; }
a.xl { color: var(--accent); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent); text-underline-offset: 3px; }
a.xl:hover { text-decoration-color: var(--accent); }
.facts { margin: 24px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: max-content minmax(0, 1fr); }
.facts dt, .facts dd { padding: 10px 0; border-bottom: 1px solid var(--line); margin: 0; }
.facts dt { color: var(--muted); font-size: 13px; padding-right: 24px; }
.facts dd { font-family: var(--font-mono); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.curbox { margin: 28px 0; padding: 20px 22px 8px; background: var(--accent-soft); border-radius: 12px; }
.curbox .label { color: var(--accent); margin-bottom: 2px; }
.curref { font-family: var(--font-mono); font-size: 14px; font-weight: 500; margin-bottom: 12px; }
.curbox .facts { margin: 0; border-top-color: color-mix(in srgb, var(--accent) 25%, transparent); }
.curbox .facts dt, .curbox .facts dd { border-bottom-color: color-mix(in srgb, var(--accent) 25%, transparent); }
.curnote { font-size: 12.5px; color: var(--muted); margin: 10px 0 12px !important; }
.refs-wrap { overflow-x: auto; margin: 6px 0 30px; padding: 8px 22px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; } /* Referenztabelle als Kachel */
.refs-wrap .refs tr:last-child td, .refs-wrap .refs tr.dsrow:last-child td { border-bottom: 0; }
.refs-wrap .refs tr.now td { background: color-mix(in srgb, var(--accent) 7%, transparent); }
.refs-wrap .refs tr.now td:first-child { border-radius: 10px 0 0 10px; padding-left: 10px; }
.refs-wrap .refs tr.now td:last-child { border-radius: 0 10px 10px 0; }
@media (max-width: 600px) { .refs-wrap { padding: 4px 14px 6px; } }
/* Datenblatt je Referenz: Aufklapper im Stil von »Über dieses Bild« */
.dsbtn { display: flex; align-items: center; gap: 5px; margin-top: 4px; padding: 0; border: 0; background: none; font: inherit; font-family: var(--font-body); font-size: 12px; font-weight: 600; color: var(--accent); cursor: pointer; white-space: nowrap; text-shadow: 0 0 7px color-mix(in srgb, var(--accent) calc(var(--gl) * 45%), var(--bg)); }
.dsbtn::after { content: ""; width: 6px; height: 6px; border-right: 1.6px solid currentColor; border-bottom: 1.6px solid currentColor; transform: translateY(-2px) rotate(45deg); transition: transform .25s ease; }
.dsbtn[aria-expanded="true"]::after { transform: translateY(1px) rotate(-135deg); }
.refs tr.hasds td { border-bottom-color: transparent; }
.refs tr.hasds.open + .dsrow td, .refs tr.dsrow td { padding: 0 0 10px; border-bottom: 1px solid var(--line); }
.dspop { padding: 8px 16px 12px; background: color-mix(in srgb, var(--surface) 60%, transparent); backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.10); animation: imgpop .22s ease; }

// Wechselkurse für die Umrechnung in Euro (Stand Anfang November 2026)
const FX = { EUR: 1, USD: 0.894, GBP: 1.20, CHF: 1.07 }, FX_NOTE = "Alle Werte in Euro umgerechnet (1 USD ≈ 0,89 EUR, 1 GBP ≈ 1,20 EUR, 1 CHF ≈ 1,07 EUR, Kurs Anfang November 2026).";
const toEUR = (v, cur) => { const e = v * (FX[cur] || 1); return e >= 10000 ? Math.round(e / 50) * 50 : Math.round(e / 10) * 10; };
const curSym = c => ({ USD: "USD", EUR: "EUR", GBP: "GBP", CHF: "CHF" }[c] || c);

// Preisvergleich Neupreis -> Gebrauchtpreis je Referenz (Hantel-Diagramm auf gemeinsamer Skala), alles in Euro.
// Zeile: [Referenz, Label Neu, Neupreis, Label Gebraucht, Gebrauchtpreis, Währung(en)]; Währung als "USD" oder ["USD", "EUR"] (neu, gebraucht).
function priceChart(pr, refs) {
  if (!pr) return "";
  const fmt = n => n.toLocaleString("de-DE");
  if (!pr.rows || !pr.rows.length) {
    if (!pr.liste) return "";
    const [v, d] = pr.liste, e = toEUR(v, pr.u);
    return `<div class="pl-box"><span class="label">Listenpreis</span><b>${fmt(e)} EUR</b><span class="pl-d">${esc(d)}</span>${pr.n ? `<p class="price-note">${esc(pr.n)}${pr.u !== "EUR" ? " " + FX_NOTE : ""}</p>` : ""}</div>`;
  }
  // Baujahr aus der Referenztabelle, wenn kein Listenpreis vorliegt
  const yearOf = ref => { const n = x => String(x).toLowerCase().replace(/[^a-z0-9.]/g, ""), q = n(ref); if (q.length < 3) return ""; const hit = (refs || []).find(x => String(x[0]).split(/[\/,]/).some(t => { const k = n(t); return k.length >= 3 && (k === q || (k.length >= 4 && q.length >= 4 && (k.startsWith(q) || q.startsWith(k))) || (k.length >= 6 && q.length >= 6 && (k.includes(q) || q.includes(k)))); })); return hit && /\d{4}/.test(hit[1]) ? String(hit[1]).replace(/\s*\(.*\)/, "") : ""; };
  const rows = pr.rows.map(r => { const c = r[5] || pr.u, [cn, cu] = Array.isArray(c) ? c : [c, c]; return { yr: r[2] == null ? yearOf(r[0]) : "", ex: (r[6] || []).map(([l, v, c]) => ({ l, v: toEUR(v, c || cn) })), ref: r[0], nl: r[1], ul: r[3], no: r[2], uo: r[4], cn, cu, nv: r[2] != null ? toEUR(r[2], cn) : null, uv: r[4] != null ? toEUR(r[4], cu) : null }; });
  const conv = rows.some(r => r.cn !== "EUR" || r.cu !== "EUR");
  const vals = rows.flatMap(r => [r.nv, r.uv, ...r.ex.map(e => e.v)]).filter(v => v != null);
  const span = Math.max(...vals) - Math.min(...vals) || Math.max(...vals) * .3;
  const raw = span / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), step = [1, 2, 2.5, 5, 10].map(k => k * mag).find(k => k >= raw);
  const lo = Math.max(0, Math.floor((Math.min(...vals) - span * .15) / step) * step), hi = Math.ceil((Math.max(...vals) + span * .15) / step) * step;
  const X = v => ((v - lo) / (hi - lo) * 100).toFixed(2);
  const ticks = []; for (let t = Math.ceil(lo / step) * step; t <= hi + 1e-9; t += step) ticks.push(t);
  const tl = t => t >= 1000 ? fmt(Math.round(t / 100) / 10) + "k" : fmt(t);
  const row = r => {
    const both = r.nv != null && r.uv != null, d = both ? Math.round((r.uv / r.nv - 1) * 100) : null;
    const dTxt = d == null ? "" : (d > 0 ? "+" : d < 0 ? "−" : "±") + Math.abs(d) + " %";
    const tip = [r.nv != null ? `Neu ${fmt(r.nv)}` : "", r.uv != null ? `Gebraucht ${fmt(r.uv)}` : ""].filter(Boolean).join(" · ") + " EUR";
    return `<div class="pc-row">
      <div class="pc-ref"><b>${esc(r.ref)}</b><span>${r.yr && !r.nl ? `Baujahr ${esc(r.yr)} → ` : ""}${esc(r.nl)}${r.nl && r.ul ? " → " : ""}${esc(r.ul)}</span></div>
      <div class="pc-track">${ticks.map(t => `<i class="pc-grid" style="left:${X(t)}%"></i>`).join("")}
        ${r.ex.length ? (() => { const vs = [r.nv, r.uv, ...r.ex.map(e => e.v)].filter(v => v != null), lo = X(Math.min(...vs)), hi = X(Math.max(...vs)); return `<i class="pc-hit" tabindex="0" style="left:calc(${lo}% - 6px);width:calc(${(hi - lo).toFixed(2)}% + 12px)"></i>`; })() : ""}
        ${both ? `<i class="pc-bar" style="left:${X(Math.min(r.nv, r.uv))}%;width:${(X(Math.max(r.nv, r.uv)) - X(Math.min(r.nv, r.uv))).toFixed(2)}%"></i>` : ""}
        ${r.uv != null ? `<i class="pc-dot pc-used" style="left:${X(r.uv)}%"></i>` : ""}${r.nv != null ? `<i class="pc-dot pc-new" style="left:${X(r.nv)}%"></i>` : ""}
        ${r.ex.map((e, k) => { const x = +X(e.v), al = x < 22 ? "left:-6px;transform:none;" : x > 78 ? "left:auto;right:-6px;transform:none;" : ""; return `<i class="pc-dot pc-ex" style="left:${x}%"><b style="${al}bottom:calc(100% + ${7 + k * 30}px)">${esc(String(e.l).replace(/ \(.*\)/, ""))}: ${fmt(e.v)}</b></i>`; }).join("")}
      </div>
      <div class="pc-val"><span>${r.nv != null ? fmt(r.nv) : "–"} → <b>${r.uv != null ? fmt(r.uv) : "–"}</b></span>${dTxt ? `<em class="${d > 0 ? "up" : d < 0 ? "down" : ""}">${dTxt}</em>` : ""}</div>
    </div>`;
  };
  const orig = (v, c, l) => v == null ? "–" : `${fmt(toEUR(v, c))} EUR${l ? ` · ${esc(l)}` : ""}`;
  return `<figure class="pc">
    <figcaption><span class="label">${esc(pr.t || "Neupreis und Gebrauchtpreis im Vergleich")}</span>
      <span class="pc-legend"><span><i class="pc-dot pc-new"></i>Neupreis (Liste)</span><span><i class="pc-dot pc-used"></i>Gebrauchtpreis heute</span></span></figcaption>
    ${rows.map(row).join("")}
    <div class="pc-row pc-axis" aria-hidden="true"><div></div><div class="pc-track">${ticks.map(t => `<span style="left:${X(t)}%">${tl(t)}</span>`).join("")}</div><div class="pc-unit">EUR</div></div>
    ${pr.n || conv ? `<p class="price-note">${esc(pr.n || "")}${conv ? " " + FX_NOTE : ""}</p>` : ""}
    <details class="pc-table"><summary>Als Tabelle anzeigen</summary><div class="refs-wrap"><table class="refs"><thead><tr><th>Referenz</th><th>Neupreis</th><th>Gebrauchtpreis</th><th>Veränderung</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td class="m">${esc(r.ref)}</td><td class="m">${r.no == null && r.yr ? `– · Baujahr ${esc(r.yr)}` : orig(r.no, r.cn, r.nl)}${r.ex.length ? `<br><small>${r.ex.map(e => `${esc(e.l)}: ${fmt(e.v)} EUR`).join(" · ")}</small>` : ""}</td><td class="m">${orig(r.uo, r.cu, r.ul)}</td><td class="m">${r.nv != null && r.uv != null ? Math.round((r.uv / r.nv - 1) * 100) + " %" : "–"}</td></tr>`).join("")}
    </tbody></table></div></details>
  </figure>`;
}

  document.querySelectorAll(".accent-switch button").forEach(b => b.setAttribute("aria-pressed", b.dataset.accent === a));
}
// Vintage + Nacht: eigene Akzentwahl, Standard ist das Grün der Leuchtmasse; sonst die normale Wahl
const vNight = () => document.documentElement.classList.contains("vintage") && document.documentElement.classList.contains("night");
window.applyAccent = () => { let a = null; try { a = vNight() ? (localStorage.getItem("wikiticks-accent-vn") || "green") : localStorage.getItem("wikiticks-accent"); } catch (e) { a = vNight() ? "green" : null; } setAccent(a); };
applyAccent();
document.addEventListener("click", ev => {
  const b = ev.target.closest && ev.target.closest(".accent-switch button"); if (!b) return;
  setAccent(b.dataset.accent);

});

// ---------- Bildvergrößerung ----------
// Klick auf ein Uhrenbild (nicht in Links) zeigt es etwa doppelt so groß, wenn die Bildauflösung dafür reicht
function zoomOK(wrap) {
  if (!wrap || wrap.closest("a, #zoom")) return null;
  const img = wrap.querySelector("img.wimg"); if (!img || !img.naturalHeight) return null;
  const r = img.getBoundingClientRect();
  return r.height && img.naturalHeight >= r.height * 1.6 ? { img, r } : null;
}
// nur bei echter Maus: auf Touchgeräten würde eine DOM-Änderung beim »Hover« den ersten Tipp verschlucken (iOS)
document.addEventListener("pointerover", ev => { if (ev.pointerType !== "mouse") return; const w = ev.target.closest && ev.target.closest(".wimg-wrap"); if (w && !w.dataset.zk) { w.dataset.zk = "1"; if (zoomOK(w)) w.classList.add("zoomable"); } });
function closeZoom() { const z = document.getElementById("zoom"); if (!z) return; z.classList.remove("on"); setTimeout(() => z.remove(), 260); }
document.addEventListener("click", ev => {
  const w = ev.target.closest && ev.target.closest(".wimg-wrap"), ok = zoomOK(w);
  if (!ok) return;
  const { img, r } = ok, ar = img.naturalWidth / img.naturalHeight;
  let h = Math.min(r.height * 2, img.naturalHeight, innerHeight * .88 - 46);
  if (h * ar > innerWidth * .94 - 46) h = (innerWidth * .94 - 46) / ar;
  const c = w.cloneNode(true); c.classList.remove("zoomable");
  const src = w.querySelectorAll("canvas"), dst = c.querySelectorAll("canvas");
  src.forEach((cv, i) => { try { dst[i].getContext("2d").drawImage(cv, 0, 0); } catch (e) {} });
  c.querySelector("img.wimg").style.height = Math.round(h) + "px";
  const z = document.createElement("div"); z.id = "zoom"; z.setAttribute("role", "dialog"); z.setAttribute("aria-label", "Vergrößerte Ansicht");
  const box = document.createElement("div"); box.className = "zbox"; box.append(c); z.append(box);
  z.addEventListener("click", closeZoom); document.body.append(z);
  requestAnimationFrame(() => requestAnimationFrame(() => z.classList.add("on")));
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeZoom(); });
addEventListener("hashchange", closeZoom);

// ---------- Zifferblatt ----------
let TOFF = 0; // Abweichung Gerätezeit → Serverzeit in ms
(function dial() {
  let h = "";
  for (let i = 0; i < 60; i++) {
    const a = i * 6 * Math.PI / 180, big = i % 5 === 0, r1 = big ? 46 : 50, r2 = 53;
    h += `<line x1="${60 + r1 * Math.sin(a)}" y1="${60 - r1 * Math.cos(a)}" x2="${60 + r2 * Math.sin(a)}" y2="${60 - r2 * Math.cos(a)}" stroke="${big ? "var(--fg)" : "var(--muted)"}" stroke-width="${big ? 2 : .8}"/>`;
  }
  $("#ticks").innerHTML = h;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const set = (id, deg) => $(id).setAttribute("transform", `rotate(${deg} 60 60)`);
  function tick() {
    const d = new Date(Date.now() + TOFF), steps = 8; // 4 Hz = 8 Halbschwingungen pro Sekunde; Zeit mit dem Server abgeglichen
    const sec = d.getSeconds() + Math.floor(d.getMilliseconds() / (1000 / steps)) / steps;
    // alle Zifferblätter (kleine Uhr oben links und die vergrößerte Ansicht)
    const rot = (h, deg) => document.querySelectorAll(`[data-hand="${h}"]`).forEach(el => el.setAttribute("transform", `rotate(${deg} 60 60)`));
    rot("s", sec * 6); rot("m", (d.getMinutes() + sec / 60) * 6); rot("h", ((d.getHours() % 12) + d.getMinutes() / 60) * 30);
  }
  tick(); setInterval(tick, 125);
  // Gerätezeit gegen die Serverzeit (Date-Header) abgleichen, falls die Uhr des Geräts um mehr als eine Sekunde abweicht
  const t0 = Date.now();
  fetch(location.pathname + "?zeit=" + t0, { method: "HEAD", cache: "no-store" }).then(r => {
    const t1 = Date.now(), h = r.headers.get("Date"); if (!h) return;
    const off = Date.parse(h) + 500 - (t0 + t1) / 2; // Header ist auf ganze Sekunden abgeschnitten: im Mittel +0,5 s
    if (Math.abs(off) > 1200 && t1 - t0 < 1500) TOFF = off;
  }).catch(() => {});
})();

// Klick auf die kleine Uhr oben links: groß darstellen (läuft live weiter), Klick oder Esc schließt
function closeDial() { const z = document.getElementById("dialzoom"); if (!z) return; z.classList.remove("on"); setTimeout(() => z.remove(), 300); }
document.querySelector(".head .dial").addEventListener("click", ev => {
  ev.preventDefault();
  const c = ev.currentTarget.cloneNode(true); c.querySelectorAll("[id]").forEach(el => el.removeAttribute("id"));
  const z = document.createElement("div"); z.id = "dialzoom"; z.setAttribute("role", "dialog"); z.setAttribute("aria-label", "Uhr groß"); z.append(c);
  z.addEventListener("click", closeDial); document.body.append(z);
  requestAnimationFrame(() => requestAnimationFrame(() => z.classList.add("on")));
});
document.addEventListener("keydown", ev => { if (ev.key === "Escape") closeDial(); });

// Regler im Mondphase-Artikel: Mondphase per Maus oder Finger einstellen
document.addEventListener("input", ev => {
  const r = ev.target.closest && ev.target.closest(".mpslide input"); if (!r) return;
  const f = r.closest("figure"), old = f.querySelector("svg"); const t = document.createElement("div"); t.innerHTML = DG.mondphase(r.value / 1000); old.replaceWith(t.firstElementChild); mpInfo(f, r.value / 1000);
});
document.addEventListener("click", ev => {
  const b = ev.target.closest && ev.target.closest(".mpslide .mpnow"); if (!b) return;
  const f = b.closest("figure"), r = f.querySelector(".mpslide input"); r.value = Math.round(moonPhase().p * 1000);
  const t = document.createElement("div"); t.innerHTML = DG.mondphase(); f.querySelector("svg").replaceWith(t.firstElementChild); mpInfo(f, moonPhase().p);
});
function mpInfo(f, p) { const n = ["Neumond", "Zunehmende Sichel", "Erstes Viertel", "Zunehmender Mond", "Vollmond", "Abnehmender Mond", "Letztes Viertel", "Abnehmende Sichel"][Math.round(p * 8) % 8]; f.querySelector(".mpn").textContent = n; f.querySelector(".mpk").textContent = Math.round((1 - Math.cos(2 * Math.PI * p)) / 2 * 100) + " %"; }
// Kompakte Menüleiste (PC und Smartphone): sobald das Menü oben verschwindet, fest am oberen Rand; Klick klappt das Menü nach unten auf
(function () {
  const bar = $("#minibar"), btn = $("#minibtn"), panel = $("#minipanel");
  const anchor = () => { const t = $("#menu"); return t.offsetParent && !$("#nav").classList.contains("open") ? t : $("#nav"); }; // aufgeklapptes Menü: Leiste erst, wenn es ganz oben verschwunden ist
  const close = () => { bar.classList.remove("open"); btn.setAttribute("aria-expanded", "false"); };
  const place = () => { if (innerWidth > 760) { const r = $("#nav").getBoundingClientRect(); bar.style.left = r.left + "px"; bar.style.width = r.width + "px"; } else { bar.style.left = ""; bar.style.width = ""; } };
  let wasOn = false;
  const check = () => { place(); const a = anchor(), r = a.getBoundingClientRect(), on = r.bottom < 0;
    if (on !== wasOn) {
      // offenes Menü beim Scrollen mitnehmen: oben offenes Menü -> Leiste offen, und zurück
      const small = innerWidth <= 760, navOpen = small && $("#nav").classList.contains("open");
      if (!on) close();
      wasOn = on;
    }
    bar.classList.toggle("on", on); bar.setAttribute("aria-hidden", on ? "false" : "true"); $("#mini-cur").textContent = $("#menu-cur").textContent; };
  addEventListener("scroll", check, { passive: true }); addEventListener("resize", check); addEventListener("hashchange", () => { close(); setTimeout(check, 50); });
  function open() { fill(); bar.classList.add("open"); btn.setAttribute("aria-expanded", "true"); }
  btn.addEventListener("click", () => { const o = !bar.classList.contains("open"); if (o) fill(); bar.classList.toggle("open", o); btn.setAttribute("aria-expanded", o); });
  // Suche im Scrollmenü: kleine Lupe neben »Startseite«, ein Tipp öffnet das Suchfeld
  const LUPE = `<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>`;
  function addSearch() {
    const g = panel.querySelector(".navgroup"); if (!g) return;
    g.classList.add("mshome");
    g.insertAdjacentHTML("beforeend", `<button type="button" class="mslupe" aria-label="Suchen" aria-expanded="false">${LUPE}</button><div class="mssearch"><input type="search" placeholder="Suchen, z. B. Tourbillon" aria-label="WikiTicks durchsuchen" enterkeyhint="search"></div>`);
    const b = g.querySelector(".mslupe"), box = g.querySelector(".mssearch"), inp = box.querySelector("input");
    inp.value = $("#q").value;
    b.addEventListener("click", ev => { ev.stopPropagation(); const o = !g.classList.contains("msopen"); g.classList.toggle("msopen", o); b.setAttribute("aria-expanded", o); if (o) setTimeout(() => inp.focus(), 60); });
    inp.addEventListener("input", () => { $("#q").value = inp.value; $("#q").dispatchEvent(new Event("input")); });
    inp.addEventListener("keydown", ev => { if (ev.key !== "Enter") return; ev.preventDefault(); const id = bestMatch(inp.value); close(); if (id) { freshNav = true; location.hash = id; } else { const first = document.querySelector("#view .card"); if (first) { freshNav = true; location.href = first.getAttribute("href"); } } inp.blur(); });
    if (inp.value) { g.classList.add("msopen"); b.setAttribute("aria-expanded", "true"); }
  }
  function fill() { panel.innerHTML = $("#nav").innerHTML + `<div class="mininight"></div>`; addSearch(); const nb = $("#nightbtn").cloneNode(true); nb.id = ""; nb.addEventListener("click", ev => { ev.stopPropagation(); $("#nightbtn").click(); setTimeout(() => { const m = $("#nightbtn"); nb.setAttribute("aria-pressed", m.getAttribute("aria-pressed")); nb.querySelector(".nl").textContent = m.querySelector(".nl").textContent; }, 0); const mg = nb.querySelector(".mp-moons"); if (mg && mg.animate && !matchMedia("(prefers-reduced-motion: reduce)").matches) mg.animate([{ transform: "rotate(0deg)" }, { transform: "rotate(360deg)" }], { duration: 850, easing: "cubic-bezier(.7,0,.25,1)" }); }); panel.querySelector(".mininight").append(nb); const vb = $("#vintbtn").cloneNode(true); vb.id = ""; const vs = vb.querySelector(".vdial"); if (vs) vs.outerHTML = vdialSVG(VINTAGE); vb.addEventListener("click", ev => { ev.stopPropagation(); setVintage(!VINTAGE); }); panel.querySelector(".mininight").append(vb); const ac = document.querySelector(".accent-switch").cloneNode(true); ac.removeAttribute("id"); panel.querySelector(".mininight").append(ac); }
  // Link im Menü: sofort öffnen (nicht erst nur das Menü schließen)
  panel.addEventListener("click", ev => { const a = ev.target.closest("a[href^='#']"); if (!a) return; ev.preventDefault(); close(); freshNav = true; location.hash = a.getAttribute("href").slice(1); });
  // Tipp neben das offene Menü: auf dem Smartphone nur Menü schließen, am PC zusätzlich den Klick ausführen
  document.addEventListener("click", ev => {
    if (!bar.classList.contains("open") || ev.target.closest("#minibar, #nightbtn, .accent-switch, #menu")) return;
    if (innerWidth > 760) { close(); return; } // Laptop/PC: Menü schließen und den Klick trotzdem ausführen
    ev.preventDefault(); ev.stopPropagation(); close(); // Smartphone: nur Menü schließen
  }, true);
  check();
})();
// Ewiger Kalender oben rechts: Wochentag, Datum, Mondphase und Monat von heute
function drawPcal() {
  const el = document.getElementById("pcal"); if (!el) return;
  const d = new Date(Date.now() + (typeof TOFF === "number" ? TOFF : 0)), R = 34, cy = 46;
  const P = (cx, a, r) => [cx + r * Math.sin(a * Math.PI / 180), cy - r * Math.cos(a * Math.PI / 180)];
  const lab = (cx, a, r, t, fs, cls = "") => { const [x, y] = P(cx, a, r), rot = (a > 90 && a < 270) ? a + 180 : a; return `<text class="lb ${cls}" x="${x.toFixed(1)}" y="${y.toFixed(1)}" font-size="${fs}" text-anchor="middle" dominant-baseline="central" transform="rotate(${rot.toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})">${t}</text>`; };
  // Zeiger wie der Sekundenzeiger der kleinen Uhr: dünn, mit Gegengewicht und Leuchtpunkt
  const hand = (cx, a, len) => { const [x, y] = P(cx, a, len), [bx, by] = P(cx, a + 180, 8), [lx, ly] = P(cx, a, len * .72); return `<line class="hd" x1="${bx.toFixed(1)}" y1="${by.toFixed(1)}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/><circle class="dlume dlume-dot" cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2.3" stroke-width=".9"/><circle class="hub" cx="${cx}" cy="${cy}" r="2.6"/>`; };
  const sub = (cx, items) => `<circle class="sd" cx="${cx}" cy="${cy}" r="${R + 6}"/>` + items;
  // Wochentag (So oben)
  const wd = ["SO", "MO", "DI", "MI", "DO", "FR", "SA"];
  let a = sub(45, wd.map((t, i) => lab(45, i * 360 / 7, R - 4, t, 8.5)).join("") + hand(45, d.getDay() * 360 / 7, R - 13));
  // Datum 1–31 (ungerade beschriftet, gerade als Punkt)
  let dd = "";
  for (let i = 1; i <= 31; i++) { const ang = (i - 1) * 360 / 31; if (i % 2) dd += lab(137, ang, R - 3, i, i > 9 ? 6.2 : 6.6, i === 31 ? "red" : ""); else { const [x, y] = P(137, ang, R - 3); dd += `<circle class="dt" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r=".9"/>`; } }
  a += sub(137, dd + hand(137, (d.getDate() - 1) * 360 / 31, R - 9));
  // Monat (Jan oben)
  const mo = ["JAN", "FEB", "MÄR", "APR", "MAI", "JUN", "JUL", "AUG", "SEP", "OKT", "NOV", "DEZ"];
  a += sub(229, mo.map((t, i) => lab(229, i * 30, R - 2.5, t, 5.8)).join("") + hand(229, d.getMonth() * 30, R - 9));
  el.innerHTML = `<defs><filter id="pglow" filterUnits="userSpaceOnUse" x="-10" y="-10" width="300" height="112"><feGaussianBlur in="SourceGraphic" stdDeviation="1.4" result="b1"/><feGaussianBlur in="SourceGraphic" stdDeviation="3.2" result="b2"/><feMerge><feMergeNode in="b2"/><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>` + a;
  el.setAttribute("aria-label", "Ewiger Kalender: " + d.toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" }));
}
drawPcal(); setInterval(drawPcal, 10 * 60 * 1000);
// Startseite: Artikel und Uhr des Tages wechseln um 0 Uhr, Wissenswertes alle drei Stunden; offene Startseite dann neu aufbauen
(() => { let last = slotNow(); setInterval(() => { const n = slotNow(); if (n === last) return; last = n; drawPcal(); if (!location.hash || location.hash === "#") { const y = scrollY; route(); scrollTo(0, y); } }, 20000); })();
// ---------- Daten laden ----------
// Daten immer frisch laden (Versionsnummer + kein Browser-Cache), sonst passen alte JSON-Daten nicht zur neuen Seite
const load = f => fetch(`${f}?v=${IMGV}`, { cache: "no-cache" }).then(r => r.ok ? r.json() : null).catch(() => null);
// Eingebettete Daten (Offline-Version) haben Vorrang, sonst werden die JSON-Dateien geladen
const DATA = window.WIKITICKS_DATA;
// Datenblätter nur für den Uhrenvergleich (datenblatt.json), werden im Hintergrund nachgeladen
let SPECS = {}; (DATA && DATA.datenblatt ? Promise.resolve(DATA.datenblatt) : load("datenblatt.json")).then(d => { SPECS = d || {}; if (E.length && byId[decodeURIComponent((location.hash || "#").slice(1))] || (location.hash || "").startsWith("#vergleich")) route(); });
(DATA ? Promise.resolve([DATA.lexikon, DATA.modelle]) : Promise.all([load("lexikon.json"), load("modelle.json")])).then(([lex, mod]) => {
  if (!lex && !mod) { $("#view").innerHTML = '<p class="empty">Die Inhalte konnten nicht geladen werden. Bitte lade die Seite neu.</p>'; return; }
  E = [...(lex || []), ...((mod && mod.modelle) || []).map(m => ({ ...m, c: "Uhrenmodelle" }))];
  ((mod && mod.marken) || []).forEach(m => { BRAND_INFO[m.name] = m; });
  const lmRaw = (mod && mod.lumeMasks) || {};
  LUMEMASK = new Map(Array.isArray(lmRaw) ? lmRaw.map(f => [f, "b"]) : Object.entries(lmRaw));
  IMGRES = new Map(Object.entries((mod && mod.imgRes) || {}));
  rebuild(); route();
  if (POS[location.hash]) requestAnimationFrame(() => window.scrollTo({ top: POS[location.hash] }));
});
