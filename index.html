<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WikiTicks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Unbounded:wght@500;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: Kopfzeile mit laufendem Zifferblatt; links gegliederte Navigation (Uhrenmodelle / Lexikon), rechts die Ansicht */
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --fg: #16202c;
  --muted: #5b6676;
  --line: #dde2ea;
  --accent: #1f4fa0;      /* gebläuter Stahl */
  --accent-soft: #e6edf8;
  --gold: #9a6f22;
  --font-display: "Instrument Serif", "Iowan Old Style", Georgia, serif;
  --font-logo: "Unbounded", "Arial Black", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --surface: #151c26; --fg: #e6ebf2; --muted: #95a1b2;
    --line: #263142; --accent: #7da6ec; --accent-soft: #1b2a42; --gold: #d4a856;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --surface: #151c26; --fg: #e6ebf2; --muted: #95a1b2;
  --line: #263142; --accent: #7da6ec; --accent-soft: #1b2a42; --gold: #d4a856;
  color-scheme: dark;
}
/* Akzentfarbe Dunkelgrün (per Umschalter) */
:root[data-accent="green"] { --accent: #1d5c42; --accent-soft: #e1eee6; }
@media (prefers-color-scheme: dark) {
  :root[data-accent="green"]:not([data-theme="light"]) { --accent: #6cc39a; --accent-soft: #16302a; }
}
:root[data-theme="dark"][data-accent="green"] { --accent: #6cc39a; --accent-soft: #16302a; }
/* Bordeaux */
:root[data-accent="bordeaux"] { --accent: #7a1f33; --accent-soft: #f4e4e8; }
@media (prefers-color-scheme: dark) {
  :root[data-accent="bordeaux"]:not([data-theme="light"]) { --accent: #e58fa1; --accent-soft: #3a1c24; }
}
:root[data-theme="dark"][data-accent="bordeaux"] { --accent: #e58fa1; --accent-soft: #3a1c24; }
/* Anthrazit */
:root[data-accent="anthrazit"] { --accent: #3a4048; --accent-soft: #e7e9ec; }
@media (prefers-color-scheme: dark) {
  :root[data-accent="anthrazit"]:not([data-theme="light"]) { --accent: #bcc4ce; --accent-soft: #252c35; }
}
:root[data-theme="dark"][data-accent="anthrazit"] { --accent: #bcc4ce; --accent-soft: #252c35; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap {
  max-width: 1320px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 1000px) { .wrap { padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); } }

/* Kopf */
header { border-bottom: 1px solid var(--line); }
.head { display: flex; align-items: center; gap: 28px; padding-block: 32px 26px; }
.dial { flex: none; width: 108px; height: 108px; }
.head h1 { font-family: var(--font-logo); font-weight: 800; font-size: clamp(2.1rem, 5vw, 3.1rem); line-height: 1; margin: 0; letter-spacing: -.03em; }
.head h1 a { color: inherit; text-decoration: none; }
.head h1 em { color: var(--accent); font-style: normal; font-weight: 700; }
.head p { margin: 8px 0 0; color: var(--muted); max-width: 56ch; }
.beat { font-family: var(--font-mono); font-size: 12px; color: var(--muted); margin-top: 6px; }
.accent-box { margin-top: 28px; padding: 18px 0 0 10px; border-top: 1px solid var(--line); }
.accent-box .label { margin-bottom: 8px; }
.accent-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); max-width: 260px; }
.accent-switch button { display: flex; align-items: center; gap: 7px; font: inherit; font-size: 13px; color: var(--muted); background: none; border: 0; border-radius: 999px; padding: 5px 12px 5px 8px; cursor: pointer; }
.accent-switch button[aria-pressed="true"] { background: var(--accent-soft); color: var(--fg); font-weight: 600; }
.accent-switch i { width: 14px; height: 14px; border-radius: 50%; display: block; }
.accent-switch .sw-blue { background: #1f4fa0; }
.accent-switch .sw-green { background: #1d5c42; }
.accent-switch .sw-bordeaux { background: #7a1f33; }
.accent-switch .sw-anthrazit { background: #3a4048; }
@media (max-width: 760px) { .accent-box { display: none; margin-top: 0; padding: 14px 4px 4px; } nav.open + .accent-box { display: block; } }
.search { position: relative; margin-top: 16px; max-width: 480px; }
.search input { width: 100%; font: inherit; padding: 11px 14px 11px 40px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--fg); }
.search input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: transparent; }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: var(--muted); }

/* Navigation */
main { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 52px; padding-block: 30px 56px; }
.menu-toggle { display: none; }
nav { display: grid; gap: 22px; align-content: start; }
.navgroup h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; margin: 0 0 6px; padding-left: 10px; }
nav ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
nav a { display: block; color: var(--fg); text-decoration: none; padding: 6px 10px; border-radius: 6px; font-size: 14.5px; }
nav a:hover { background: var(--accent-soft); }
nav a[aria-current="true"] { background: var(--accent); color: var(--surface); }
nav a.sub { padding-left: 22px; color: var(--muted); font-size: 14px; }
nav a.sub[aria-current="true"] { color: var(--surface); }
nav a.home { font-weight: 600; }
nav a.more { color: var(--accent); font-weight: 500; }

/* Allgemeine Bausteine */
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; margin: 0 0 10px; }
.crumbs { font-size: 13px; color: var(--muted); margin-bottom: 18px; display: flex; flex-wrap: wrap; gap: 4px 8px; }
.crumbs a { color: var(--accent); text-decoration: none; }
.crumbs a:hover { text-decoration: underline; }
.crumbs span[aria-hidden] { opacity: .6; }
.page-title { font-family: var(--font-display); font-weight: 400; font-size: clamp(2.2rem, 5vw, 3rem); line-height: 1.05; margin: 0 0 10px; text-wrap: balance; }
.intro { color: var(--muted); max-width: 64ch; margin: 0 0 22px; }
.count { color: var(--muted); margin: 0 0 16px; font-size: 13px; }
.section-title { font-family: var(--font-logo); font-weight: 500; font-size: 1.55rem; line-height: 1.15; letter-spacing: -.02em; margin: 0 0 8px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }
.grid + .label { margin-top: 26px; }
.card { display: flex; flex-direction: column; gap: 6px; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; color: inherit; text-decoration: none; transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--accent); transform: translateY(-1px); }
.card .cat { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--gold); font-weight: 600; }
.card h3 { font-family: var(--font-display); font-weight: 400; font-size: 1.55rem; line-height: 1.15; margin: 0; }
.card p { margin: 0; color: var(--muted); font-size: 14px; }
.empty { padding: 30px 0; color: var(--muted); }

/* Artikel */
article { max-width: calc(70ch + 360px); }
article > :not(.topfig) { max-width: 70ch; }
/* Erstes Bild oben rechts, Text fließt links daneben */
article .topfig { float: right; width: 320px; margin: 4px 0 20px 36px; }
article .topfig.watchfig svg.watch { height: 280px; }
article .topfig .watchfig { margin: 0; }
article .lexfig.topfig { width: 380px; }
article .topfig figcaption b { display: block; }
article .gallery-inline, article .refs-wrap, article .curbox, article .timeline { clear: right; }
@media (max-width: 1100px) { article .topfig { width: 260px; margin-left: 24px; } article .topfig.watchfig svg.watch { height: 230px; } }
@media (max-width: 760px) {
  article .topfig { float: none; width: auto; margin: 6px 0 20px; }
  /* Handy: Bild unter Überschrift und Kurzbeschreibung */
  article { display: flex; flex-direction: column; }
  article > * { order: 6; min-width: 0; max-width: 100%; }
  article > .cat { order: 1; } article > h2 { order: 2; } article > .meta { order: 3; } article > .lead { order: 4; } article > .topfig { order: 5; }
}
article .cat { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--gold); font-weight: 600; }
article h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2.2rem, 5vw, 3rem); line-height: 1.05; margin: 6px 0 12px; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 18px; margin: 0 0 16px; font-size: 13px; color: var(--muted); }
.meta b, .meta a { color: var(--fg); font-weight: 600; }
article .lead { font-size: 1.15rem; margin: 0 0 22px; }
article p { margin: 0 0 14px; }
a.xl { color: var(--accent); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent); text-underline-offset: 3px; }
a.xl:hover { text-decoration-color: var(--accent); }
.facts { margin: 24px 0; border-top: 1px solid var(--line); display: grid; grid-template-columns: max-content minmax(0, 1fr); }
.facts dt, .facts dd { padding: 10px 0; border-bottom: 1px solid var(--line); margin: 0; }
.facts dt { color: var(--muted); font-size: 13px; padding-right: 24px; }
.facts dd { font-family: var(--font-mono); font-size: 13.5px; font-variant-numeric: tabular-nums; }
.curbox { margin: 28px 0; padding: 20px 22px 8px; background: var(--accent-soft); border-radius: 12px; }
.curbox .label { color: var(--accent); margin-bottom: 2px; }
.curref { font-family: var(--font-mono); font-size: 14px; font-weight: 500; margin-bottom: 12px; }
.curbox .facts { margin: 0; border-top-color: color-mix(in srgb, var(--accent) 25%, transparent); }
.curbox .facts dt, .curbox .facts dd { border-bottom-color: color-mix(in srgb, var(--accent) 25%, transparent); }
.curnote { font-size: 12.5px; color: var(--muted); margin: 10px 0 12px !important; }
.refs-wrap { overflow-x: auto; margin: 4px 0 28px; }
.refs { border-collapse: collapse; width: 100%; min-width: 600px; font-size: 13.5px; }
.refs th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: 600; padding: 8px 12px 8px 0; border-bottom: 1px solid var(--line); }
.refs td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.refs td.m { font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.refs td.n { color: var(--muted); min-width: 200px; }
.refs tr.now td { background: var(--accent-soft); }
.refs tr.now td:first-child { padding-left: 8px; }
.chip { display: inline-block; font-family: var(--font-body); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--surface); background: var(--accent); padding: 1px 6px; border-radius: 4px; margin-left: 6px; vertical-align: 1px; }
.rel { display: flex; flex-wrap: wrap; gap: 8px; }
.rel a { font-size: 13px; color: var(--accent); background: var(--accent-soft); padding: 5px 11px; border-radius: 999px; text-decoration: none; }
.rel a:hover { text-decoration: underline; }

/* Startseite */
.daily { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 32px; padding: 30px; margin-bottom: 40px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.daily .kicker { font-family: var(--font-logo); font-size: 15px; letter-spacing: -.01em; color: var(--accent); font-weight: 500; }
.daily .kicker span { font-family: var(--font-mono); font-size: 12px; }
.daily .kicker span { color: var(--muted); font-weight: 500; font-family: var(--font-mono); letter-spacing: .02em; text-transform: none; margin-left: 8px; }
.daily h2 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2.2rem, 5vw, 3.2rem); line-height: 1.05; margin: 8px 0 12px; text-wrap: balance; }
.daily .lead { font-size: 1.1rem; margin: 0 0 14px; }
.daily p { margin: 0 0 12px; max-width: 62ch; }
.daily .go { display: inline-block; margin-top: 6px; font-weight: 600; text-decoration: none; }
.daily .go:hover { text-decoration: underline; }
.daily aside { border-left: 1px solid var(--line); padding-left: 28px; align-self: start; }
.daily aside .facts { margin: 0; grid-template-columns: minmax(0, 1fr); border-top: 0; }
.daily aside .facts dt { border-bottom: 0; padding-bottom: 0; }
.daily .curref { font-size: 13px; margin-bottom: 4px; }
.feature { margin-bottom: 40px; }
.feature-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; margin-bottom: 14px; }
.feature-head p { margin: 0; font-size: 13px; color: var(--muted); font-family: var(--font-mono); }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.fcard { display: flex; flex-direction: column; gap: 10px; padding: 22px; background: var(--accent-soft); border-radius: 12px; color: inherit; text-decoration: none; transition: transform .15s; }
.fcard:hover { transform: translateY(-2px); }
.fcard .kicker { font-family: var(--font-logo); font-size: 13px; letter-spacing: -.01em; color: var(--accent); font-weight: 500; }
.fcard blockquote { margin: 0; font-family: var(--font-display); font-size: 1.4rem; line-height: 1.25; text-wrap: pretty; flex: 1; }
.fcard .more { font-size: 13px; color: var(--muted); }
.fcard .more b { color: var(--fg); font-weight: 600; }
.browse { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.browse a { display: block; padding: 18px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; color: inherit; background: var(--surface); }
.browse a:hover { border-color: var(--accent); }
.browse b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.4rem; line-height: 1.2; }
.browse span { color: var(--muted); font-size: 13.5px; }

/* Illustrationen */
svg.watch { display: block; width: 100%; height: 100%; }
.daily-fig { display: flex; flex-direction: column; align-items: center; justify-content: center; align-self: stretch; background: var(--bg); border-radius: 12px; padding: 18px; min-height: 260px; }
.daily-fig svg.watch { max-height: 320px; width: auto; }
.watchfig { margin: 6px 0 24px; padding: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; display: grid; justify-items: center; gap: 10px; }
.watchfig svg.watch { height: 300px; width: auto; max-width: 100%; }
.watchfig figcaption { font-size: 12px; color: var(--muted); text-align: center; }
.thumb { height: 150px; margin: -6px -6px 6px; padding: 10px; background: var(--bg); border-radius: 8px; display: flex; justify-content: center; }
.thumb svg.watch { width: auto; }
@media (max-width: 760px) { .daily-fig { min-height: 220px; } .daily-fig svg.watch { max-height: 240px; } .watchfig svg.watch { height: 240px; } }

.gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin: 6px 0 8px; }
.gallery .watchfig { margin: 0; padding: 14px 10px 12px; }
.gallery .watchfig svg.watch { height: 230px; }
.gallery .watchfig.main { border-color: var(--accent); }
.lexfig .watchfig figcaption, .gallery figcaption { display: grid; gap: 2px; font-size: 12px; color: var(--muted); }
.lexfig .watchfig figcaption b, .gallery figcaption b { color: var(--fg); font-weight: 600; font-size: 12.5px; }
.lexfig { margin: 6px 0 24px; display: grid; gap: 12px; }
.diagram { margin: 0; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; display: grid; gap: 8px; }
.diagram-svg { width: 100%; max-height: 260px; overflow: visible; }
.diagram figcaption { font-size: 12px; color: var(--muted); text-align: center; }
a.watchfig { text-decoration: none; color: inherit; }
a.watchfig:hover { border-color: var(--accent); }
.watchfig.night { background: #0b0e0c; border-color: #0b0e0c; }
.watchfig.night figcaption, .watchfig.night figcaption b { color: #cfe9d6; }
.art-h { font-family: var(--font-logo); font-weight: 500; font-size: 1.15rem; letter-spacing: -.01em; margin: 30px 0 10px; scroll-margin-top: 16px; }
.toc { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 6px; }
.toc button { font: inherit; font-size: 12.5px; color: var(--accent); background: var(--accent-soft); border: 0; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.toc button:hover { text-decoration: underline; }
.timeline { list-style: none; margin: 4px 0 18px; padding: 0 0 0 4px; border-left: 2px solid var(--accent-soft); display: grid; gap: 10px; }
.timeline li { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 10px; position: relative; padding-left: 14px; }
.timeline li::before { content: ""; position: absolute; left: -8px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); border: 2px solid var(--bg); }
.timeline .ty { font-family: var(--font-mono); font-size: 13px; font-weight: 500; color: var(--accent); font-variant-numeric: tabular-nums; }
.timeline .tt { font-size: 14.5px; }
.art-list { margin: 0 0 14px; padding-left: 20px; display: grid; gap: 6px; }
.art-list li::marker { color: var(--accent); }
article .curbox { margin-top: 10px; }
.gallery-inline { margin: 18px 0 8px; grid-template-columns: repeat(auto-fit, minmax(170px, 240px)); }
.pc { margin: 14px 0 26px; padding: 18px 20px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.pc figcaption { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; margin-bottom: 14px; }
.pc figcaption .label { margin: 0; }
.pc-legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); }
.pc-legend span { display: inline-flex; align-items: center; gap: 6px; }
.pc-legend .pc-dot { position: static; transform: none; }
.pc-row { display: grid; grid-template-columns: minmax(120px, 170px) minmax(0, 1fr) 150px; gap: 16px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); outline: none; }
.pc-row:first-of-type { border-top: 0; }
.pc-ref b { display: block; font-family: var(--font-mono); font-weight: 500; font-size: 13.5px; }
.pc-ref span { font-size: 12px; color: var(--muted); }
.pc-track { position: relative; height: 26px; }
.pc-grid { position: absolute; top: 2px; bottom: 2px; width: 1px; background: var(--line); }
.pc-bar { position: absolute; top: 50%; height: 2px; margin-top: -1px; background: var(--accent); opacity: .45; }
.pc-dot { position: absolute; top: 50%; width: 12px; height: 12px; border-radius: 50%; transform: translate(-50%, -50%); box-shadow: 0 0 0 2px var(--surface); display: inline-block; }
.pc-new { background: transparent; border: 2px solid var(--muted); box-sizing: border-box; width: 16px; height: 16px; box-shadow: none; }
.pc-legend .pc-new { width: 12px; height: 12px; }
.pc-used { background: var(--accent); }
.pc-tip { position: absolute; left: 50%; bottom: calc(100% + 4px); transform: translateX(-50%); white-space: nowrap; font-size: 12px; padding: 4px 8px; border-radius: 6px; background: var(--fg); color: var(--bg); opacity: 0; pointer-events: none; transition: opacity .15s; }
.pc-row:hover .pc-tip, .pc-row:focus .pc-tip { opacity: 1; }
.pc-row:hover .pc-bar, .pc-row:focus .pc-bar { opacity: .8; }
.pc-val { display: grid; justify-items: end; gap: 2px; font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); }
.pc-val b { color: var(--fg); font-weight: 500; }
.pc-val em { font-style: normal; font-size: 12px; padding: 1px 7px; border-radius: 999px; background: var(--accent-soft); color: var(--fg); }
.pc-axis { padding: 4px 0 0; border-top: 0; }
.pc-axis .pc-track { height: 16px; }
.pc-axis span { position: absolute; transform: translateX(-50%); font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.pc-unit { font-family: var(--font-mono); font-size: 11px; color: var(--muted); text-align: right; }
.pc-table { margin-top: 10px; font-size: 13px; }
.pc-table summary { cursor: pointer; color: var(--accent); }
.pc-orig { color: var(--muted); }
.pc-table .refs { min-width: 0; margin-top: 8px; }
.price-note { font-size: 12px; color: var(--muted); margin: 12px 0 0 !important; }
.pl-box { margin: 14px 0 26px; padding: 14px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.pl-box .label { margin: 0; flex-basis: 100%; }

<script>

const esc = s => String(s).replace(/[&<>"]/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]));

const CAT_ORDER = ["Werk & Antrieb", "Gangregelung & Präzision", "Komplikationen", "Gehäuse & Bauteile", "Materialien & Veredelung", "Geschichte", "Herkunft & Institutionen", "Praxis & Wissen", "Persönlichkeiten"];

  "Gangregelung & Präzision": "Alles, was eine Uhr genau macht: Hemmung, Unruh, Frequenz, Prüfverfahren und Gütesiegel für die Gangleistung.",
  "Komplikationen": "Alles, was eine Uhr über Stunden, Minuten und Sekunden hinaus kann: Chronograph, Kalender, Zeitzonen und Schlagwerke.",
  "Gehäuse & Bauteile": "Die sichtbaren Teile einer Uhr, von der Krone bis zum Gehäuseboden und zum Armband.",

let E = [], byId = {}, MODELS = [], LEX = [], BRANDS = [], BRAND_INFO = {}, TERM_RE = null, TERMS = {};
let q = "";

function rebuild() {
  byId = Object.fromEntries(E.map(e => [e.id, e]));
  MODELS = E.filter(e => e.brand);
  LEX = E.filter(e => !e.brand);
  BRANDS = [...new Set(MODELS.map(e => e.brand))].sort((a, b) => a.localeCompare(b, "de"));
  // Begriffe für die automatische Verlinkung im Fließtext
  TERMS = {};
  // Begriffe werden escapt gespeichert, weil im bereits escapten Text gesucht wird (z. B. »A. Lange &amp; Söhne«)
  const add = (term, target) => { if (term && term.length > 2) { term = esc(term); if (!(term in TERMS)) TERMS[term] = target; } };
  add("Swatch Group", null); // Konzern, nicht die Marke Swatch: nicht verlinken
  E.forEach(e => {
    add(e.t, e.id);
    if (e.brand && !e.ns) add(e.t.replace(e.brand + " ", ""), e.id);
    (e.a || []).forEach(a => add(a, e.id));
  });
  BRANDS.forEach(b => add(b, "marke-" + slug(b)));
  const alts = Object.keys(TERMS).sort((a, b) => b.length - a.length).map(t => t.replace(/[.*+?^${}()|[\]\\\/]/g, "\\$&"));
  TERM_RE = new RegExp(`(?<![\\p{L}\\d])(${alts.join("|")})(\\p{L}{0,3})(?![\\p{L}\\d])`, "gu");
}

// Verlinkt im (bereits escapten) Text jeden Begriff einmal pro Seite
function linkify(html, selfId, used) {
  return html.replace(TERM_RE, (m, term) => {
    const target = TERMS[term];
    if (!target || target === selfId || used.has(target)) return m;
    used.add(target);
    return `<a class="xl" href="#${target}">${m}</a>`;
  });
}

// ---------- Tägliche Auswahl (für alle Besucher gleich) ----------
const MAIN_DAYS = 1, ROTATE_DAYS = 1, FEATURED = 3;
const today = () => Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 864e5);
function shuffled(seed, list) {
  let s = seed >>> 0;

  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
// Jeder Eintrag kommt einmal dran, bevor sich einer wiederholt
// Artikel des Tages von Hand festlegen (ID eines Eintrags); leer lassen ("") für die automatische tägliche Auswahl

  const period = Math.floor(today() / MAIN_DAYS), round = Math.floor(period / list.length);
  return shuffled(round * 40503 + salt, list)[period % list.length];
}
function featured(exclude) {
  const day = today(), period = Math.floor(day / ROTATE_DAYS);
  const pool = shuffled(period * 2654435761, E.filter(e => e.k && e.id !== exclude));
  return { items: pool.slice(0, FEATURED), start: new Date(period * ROTATE_DAYS * 864e5), end: new Date((period + 1) * ROTATE_DAYS * 864e5 - 1), left: (period + 1) * ROTATE_DAYS - day };

function drawWatch(v = {}, e = null) {

function lexFigures(e) {

// Wechselkurse für die Umrechnung in Euro (Stand Anfang November 2026)
const FX = { EUR: 1, USD: 0.894, GBP: 1.20, CHF: 1.07 }, FX_NOTE = "Alle Werte in Euro umgerechnet (1 USD ≈ 0,89 EUR, 1 GBP ≈ 1,20 EUR, 1 CHF ≈ 1,07 EUR, Kurs Anfang November 2026).";
const toEUR = (v, cur) => { const e = v * (FX[cur] || 1); return e >= 10000 ? Math.round(e / 50) * 50 : Math.round(e / 10) * 10; };
const curSym = c => ({ USD: "USD", EUR: "EUR", GBP: "GBP", CHF: "CHF" }[c] || c);

// Preisvergleich Neupreis -> Gebrauchtpreis je Referenz (Hantel-Diagramm auf gemeinsamer Skala), alles in Euro.
// Zeile: [Referenz, Label Neu, Neupreis, Label Gebraucht, Gebrauchtpreis, Währung(en)]; Währung als "USD" oder ["USD", "EUR"] (neu, gebraucht).
function priceChart(pr) {
  if (!pr) return "";
  const fmt = n => n.toLocaleString("de-DE");
  if (!pr.rows || !pr.rows.length) {
    if (!pr.liste) return "";
    const [v, d] = pr.liste, e = toEUR(v, pr.u);
    return `<div class="pl-box"><span class="label">Listenpreis</span><b>${fmt(e)} EUR</b><span class="pl-d">${esc(d)}</span>${pr.n ? `<p class="price-note">${esc(pr.n)}${pr.u !== "EUR" ? " " + FX_NOTE : ""}</p>` : ""}</div>`;
  }
  const rows = pr.rows.map(r => { const c = r[5] || pr.u, [cn, cu] = Array.isArray(c) ? c : [c, c]; return { ref: r[0], nl: r[1], ul: r[3], no: r[2], uo: r[4], cn, cu, nv: r[2] != null ? toEUR(r[2], cn) : null, uv: r[4] != null ? toEUR(r[4], cu) : null }; });
  const conv = rows.some(r => r.cn !== "EUR" || r.cu !== "EUR");
  const vals = rows.flatMap(r => [r.nv, r.uv]).filter(v => v != null);
  const span = Math.max(...vals) - Math.min(...vals) || Math.max(...vals) * .3;
  const raw = span / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), step = [1, 2, 2.5, 5, 10].map(k => k * mag).find(k => k >= raw);
  const lo = Math.max(0, Math.floor((Math.min(...vals) - span * .15) / step) * step), hi = Math.ceil((Math.max(...vals) + span * .15) / step) * step;
  const X = v => ((v - lo) / (hi - lo) * 100).toFixed(2);
  const ticks = []; for (let t = Math.ceil(lo / step) * step; t <= hi + 1e-9; t += step) ticks.push(t);
  const tl = t => t >= 1000 ? fmt(Math.round(t / 100) / 10) + "k" : fmt(t);
  const row = r => {
    const both = r.nv != null && r.uv != null, d = both ? Math.round((r.uv / r.nv - 1) * 100) : null;
    const dTxt = d == null ? "" : (d > 0 ? "+" : d < 0 ? "−" : "±") + Math.abs(d) + " %";
    const tip = [r.nv != null ? `Neu ${fmt(r.nv)}` : "", r.uv != null ? `Gebraucht ${fmt(r.uv)}` : ""].filter(Boolean).join(" · ") + " EUR";
    return `<div class="pc-row" tabindex="0" title="${esc(`${r.ref}: ${tip}`)}">
      <div class="pc-ref"><b>${esc(r.ref)}</b><span>${esc(r.nl)}${r.nl && r.ul ? " → " : ""}${esc(r.ul)}</span></div>
      <div class="pc-track">${ticks.map(t => `<i class="pc-grid" style="left:${X(t)}%"></i>`).join("")}
        ${both ? `<i class="pc-bar" style="left:${X(Math.min(r.nv, r.uv))}%;width:${(X(Math.max(r.nv, r.uv)) - X(Math.min(r.nv, r.uv))).toFixed(2)}%"></i>` : ""}
        ${r.uv != null ? `<i class="pc-dot pc-used" style="left:${X(r.uv)}%"></i>` : ""}${r.nv != null ? `<i class="pc-dot pc-new" style="left:${X(r.nv)}%"></i>` : ""}
        <span class="pc-tip">${esc(tip)}</span>
      </div>
      <div class="pc-val"><span>${r.nv != null ? fmt(r.nv) : "–"} → <b>${r.uv != null ? fmt(r.uv) : "–"}</b></span>${dTxt ? `<em class="${d > 0 ? "up" : d < 0 ? "down" : ""}">${dTxt}</em>` : ""}</div>
    </div>`;
  };
  const orig = (v, c, l) => v == null ? "–" : `${fmt(toEUR(v, c))} EUR${l ? ` · ${esc(l)}` : ""}`;
  return `<figure class="pc">
    <figcaption><span class="label">${esc(pr.t || "Neupreis und Gebrauchtpreis im Vergleich")}</span>
      <span class="pc-legend"><span><i class="pc-dot pc-new"></i>Neupreis (Liste)</span><span><i class="pc-dot pc-used"></i>Gebrauchtpreis heute</span></span></figcaption>
    ${rows.map(row).join("")}
    <div class="pc-row pc-axis" aria-hidden="true"><div></div><div class="pc-track">${ticks.map(t => `<span style="left:${X(t)}%">${tl(t)}</span>`).join("")}</div><div class="pc-unit">EUR</div></div>
    ${pr.n || conv ? `<p class="price-note">${esc(pr.n || "")}${conv ? " " + FX_NOTE : ""}</p>` : ""}
    <details class="pc-table"><summary>Als Tabelle anzeigen</summary><div class="refs-wrap"><table class="refs"><thead><tr><th>Referenz</th><th>Neupreis</th><th>Gebrauchtpreis</th><th>Veränderung</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td class="m">${esc(r.ref)}</td><td class="m">${orig(r.no, r.cn, r.nl)}</td><td class="m">${orig(r.uo, r.cu, r.ul)}</td><td class="m">${r.nv != null && r.uv != null ? Math.round((r.uv / r.nv - 1) * 100) + " %" : "–"}</td></tr>`).join("")}
    </tbody></table></div></details>
  </figure>`;
}

function viewEntry(e) {
  const used = new Set();
  const trail = e.brand
    ? [["Uhrenmodelle", "uhrenmodelle"], [e.brand, "marke-" + slug(e.brand)], [shortName(e)]]
    : [["Lexikon", "a-z"], [e.c, "rubrik-" + slug(e.c)], [e.t]];
  const facts = e.cur
    ? `<div class="curbox">
        <div class="label">Aktuelle Ausführung</div>
        <div class="curref">${esc(e.cur)}</div>
        ${factList(e.f)}
        <p class="curnote">Frühere Ausführungen unterscheiden sich in Größe, Werk und Details. Siehe alle Referenzen unten.</p>
      </div>`
    : factList(e.f);
  const refs = e.refs ? `<div class="label">Alle Referenzen</div>
    <div class="refs-wrap"><table class="refs"><thead><tr><th>Ref.</th><th>Bauzeit</th><th>Größe</th><th>Kaliber</th><th>Merkmale</th></tr></thead>
    <tbody>${e.refs.map(x => { const now = /^seit/.test(x[1]); return `<tr${now ? ' class="now"' : ""}><td class="m">${esc(x[0])}${now ? ' <span class="chip">aktuell</span>' : ""}</td><td class="m">${esc(x[1])}</td><td class="m">${esc(x[2])}</td><td class="m">${esc(x[3])}</td><td class="n">${esc(x[4])}</td></tr>`; }).join("")}</tbody></table></div>` : "";
  const meta = e.brand ? `<p class="meta"><span>Hersteller <a href="#marke-${slug(e.brand)}">${esc(e.brand)}</a></span><span>Erstvorstellung <b>${esc(e.since || "–")}</b></span>${e.designer ? `<span>Design <b>${esc(e.designer)}</b></span>` : ""}</p>` : "";
  if (e.brand) used.add("marke-" + slug(e.brand));
  const related = e.r.filter(id => byId[id] && id !== e.id);
  const LF = e.brand ? null : lexFigures(e);
  // Modelle: oben nur die aktuelle Ausführung, höchstens zwei Varianten weiter unten nach der Geschichte
  const vars = e.brand ? (e.var || []).slice(0, 2) : [];
  const varGallery = vars.length ? `<div class="gallery gallery-inline">${vars.map(x => `<figure class="watchfig">${drawWatch(withVariant(e.v, { ...x.v, ...((y => { const a = +(y.match(/\d{4}/) || [9999])[0]; return a < 2005 ? { era: "vintage" } : {}; })(x.y || "")) }), e)}<figcaption><b>${esc(x.n)}</b>${esc(x.y || "")}</figcaption></figure>`).join("")}</div><p class="gallery-note">Weitere Ausführungen, vereinfacht dargestellt</p>` : "";
  return crumbs(trail) + `
    <article>
      ${e.brand ? (e.topv ? `<figure class="watchfig topfig">${drawWatch(withVariant(e.v, { ...e.topv.v, ...(+((e.topv.y || "").match(/\d{4}/) || [9999])[0] < 2005 ? { era: "vintage" } : {}) }), e)}<figcaption><b>${esc(e.topv.n)}</b>${esc(e.topv.y || "")}<br>Illustration, vereinfacht</figcaption></figure>` : `<figure class="watchfig topfig">${drawWatch(e.v, e)}<figcaption>${e.cur ? `<b>Aktuelle Ausführung</b>${esc(e.cur)}<br>` : ""}Illustration, vereinfacht</figcaption></figure>`) : LF.top}
      <div class="cat">${esc(e.brand ? e.brand + " · Uhrenmodell" : e.c)}</div>
      <h2>${esc(e.t)}</h2>
      ${meta}
      <p class="lead">${esc(e.s)}</p>
      ${(() => {
        const H = (key, title) => `<h3 class="art-h" id="sec-${key}">${title}</h3>`;
        const P = arr => arr.map(p => `<p>${linkify(esc(p), e.id, used)}</p>`).join("");
        const UL = arr => `<ul class="art-list">${arr.map(t => `<li>${linkify(esc(t), e.id, used)}</li>`).join("")}</ul>`;
        if (e.brand) {
          // Zeitleiste aus Referenzen und besonderen Ereignissen
          const yr = t => { const m = String(t).match(/\d{4}/); return m ? +m[0] : null; };
          const tl = [...(e.refs || []).filter(x => yr(x[1])).map(x => [yr(x[1]), `Ref. ${x[0]}${x[4] ? ": " + x[4] : ""}`]), ...(e.ev || []).map(x => [yr(x[0]), x[1]])]
            .filter(x => x[0]).sort((a, b) => a[0] - b[0]);
          const timeline = tl.length >= 3 ? `<ol class="timeline">${tl.map(([y, t]) => `<li><span class="ty">${y}</span><span class="tt">${linkify(esc(t), e.id, used)}</span></li>`).join("")}</ol>` : "";
          const parts = [["geschichte", "Geschichte"], ...(timeline ? [["zeitleiste", "Zeitleiste"]] : []), ...(e.m ? [["merkmale", "Erkennungsmerkmale"]] : []), ...(e.x ? [["experte", "Expertenwissen"]] : []), ...(e.tipp ? [["sammler", "Wissenswert für Sammler und Käufer"]] : []), ...(e.refs ? [["referenzen", "Alle Referenzen"]] : []), ["technik", "Technik der aktuellen Ausführung"]];
          return `<nav class="toc" aria-label="Inhalt">${parts.map(([k, t]) => `<button type="button" data-sec="${k}">${t}</button>`).join("")}</nav>`
            + H("geschichte", "Geschichte") + P(e.b) + varGallery
            + (timeline ? H("zeitleiste", "Zeitleiste") + timeline : "")
            + (e.m ? H("merkmale", "Erkennungsmerkmale") + UL(e.m) : "")
            + (e.x ? H("experte", "Expertenwissen") + UL(e.x) : "")
            + (e.tipp ? H("sammler", "Wissenswert für Sammler und Käufer") + UL(e.tipp) + priceChart(e.preis) : "")
            + (e.refs ? H("referenzen", "Alle Referenzen") + refs.replace('<div class="label">Alle Referenzen</div>', "") : "")
            + H("technik", "Technik der aktuellen Ausführung") + facts;
        }
        const person = e.c === "Persönlichkeiten";
        return H("grundlagen", person ? "Herkunft" : "Grundlagen") + P(e.b.slice(0, 1))
          + (e.g ? H("geschichte", "Geschichte") + P(e.g) : "")
          + (e.b.length > 1 ? H("detail", person ? "Leben und Werk" : "Im Detail") + P(e.b.slice(1)) : "")
          + (e.x ? H("experte", "Expertenwissen") + UL(e.x) : "")
          + LF.rest
          + H("eckdaten", "Auf einen Blick") + facts;
      })()}
      ${related.length ? `<div class="label">Siehe auch</div><div class="rel">${related.map(id => `<a href="#${id}">${esc(byId[id].t)}</a>`).join("")}</div>` : ""}
    </article>`;
}

function viewSearch(term) {
  const t = term.toLowerCase();
  const hit = e => [e.t, e.brand, e.s, ...(e.a || []), ...e.b, ...(e.refs || []).map(x => x[0])].join(" ").toLowerCase().includes(t);
  const lex = LEX.filter(hit).sort((a, b) => a.t.localeCompare(b.t, "de"));
  const mod = MODELS.filter(hit).sort((a, b) => a.t.localeCompare(b.t, "de"));
  const brands = BRANDS.filter(b => b.toLowerCase().includes(t));
  const n = lex.length + mod.length + brands.length;
  return `
    <h2 class="page-title">Suche</h2>
    <p class="count">${plural(n, "Treffer", "Treffer")} für »${esc(term)}«</p>
    ${n ? "" : `<p class="empty">Nichts gefunden. Versuche einen anderen Begriff oder stöbere im <a href="#a-z">Lexikon A–Z</a>.</p>`}
    ${brands.length ? `<div class="label">Marken</div><div class="grid">${brands.map(b => `<a class="card" href="#marke-${slug(b)}"><span class="cat">Marke</span><h3>${esc(b)}</h3><p>${plural(MODELS.filter(e => e.brand === b).length, "Modell", "Modelle")}</p></a>`).join("")}</div>` : ""}
    ${mod.length ? `<div class="label">Uhrenmodelle</div><div class="grid">${mod.map(e => card(e)).join("")}</div>` : ""}
    ${lex.length ? `<div class="label">Lexikon</div><div class="grid">${lex.map(e => card(e)).join("")}</div>` : ""}`;
}

// ---------- Routing ----------
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  renderNav(h);
  $("#nav").classList.remove("open"); $("#menu").setAttribute("aria-expanded", "false");
  const brand = h.startsWith("marke-") && BRANDS.find(b => slug(b) === h.slice(6));
  const cat = h.startsWith("rubrik-") && CAT_ORDER.find(c => slug(c) === h.slice(7));
  let html;
  if (q.trim()) html = viewSearch(q.trim());
  else if (h === "uhrenmodelle") html = viewModels();
  else if (h === "a-z") html = viewAZ();
  else if (brand) html = viewBrand(brand);
  else if (cat) html = viewCategory(cat);
  else if (byId[h]) html = viewEntry(byId[h]);
  else html = viewHome();
  $("#view").innerHTML = html;
}

window.addEventListener("hashchange", () => { q = ""; $("#q").value = ""; route(); window.scrollTo({ top: 0 }); });
$("#q").addEventListener("input", ev => { q = ev.target.value; route(); });
$("#view").addEventListener("click", ev => {
  const t = ev.target.closest(".toc button");
  if (t) document.getElementById("sec-" + t.dataset.sec)?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
  const vt = ev.target.closest(".vtoggle button");
  if (vt) { listMode = vt.dataset.v === "list"; try { localStorage.setItem("wikiticks-view", listMode ? "list" : "cards"); } catch (e) {} const y = scrollY; route(); scrollTo({ top: y }); return; }
  const b = ev.target.closest(".letters button");
  if (b) document.getElementById("az-" + b.dataset.l)?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
});

// ---------- Farbumschalter (Auswahl wird im Browser gemerkt) ----------
const ACCENTS = ["blue", "green", "bordeaux", "anthrazit"];
function setAccent(a) {
  if (!ACCENTS.includes(a)) a = "blue";
  if (a === "blue") document.documentElement.removeAttribute("data-accent");
  else document.documentElement.setAttribute("data-accent", a);
  document.querySelectorAll(".accent-switch button").forEach(b => b.setAttribute("aria-pressed", b.dataset.accent === a));
}
try { setAccent(localStorage.getItem("wikiticks-accent")); } catch (e) {}
document.querySelector(".accent-switch").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if (!b) return;
  setAccent(b.dataset.accent);
  try { localStorage.setItem("wikiticks-accent", b.dataset.accent); } catch (e) {}
});

// ---------- Zifferblatt ----------
(function dial() {
  let h = "";
  for (let i = 0; i < 60; i++) {
    const a = i * 6 * Math.PI / 180, big = i % 5 === 0, r1 = big ? 46 : 50, r2 = 53;
    h += `<line x1="${60 + r1 * Math.sin(a)}" y1="${60 - r1 * Math.cos(a)}" x2="${60 + r2 * Math.sin(a)}" y2="${60 - r2 * Math.cos(a)}" stroke="${big ? "var(--fg)" : "var(--muted)"}" stroke-width="${big ? 2 : .8}"/>`;
  }
  $("#ticks").innerHTML = h;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const set = (id, deg) => $(id).setAttribute("transform", `rotate(${deg} 60 60)`);
  function tick() {
    const d = new Date(), steps = reduce ? 1 : 8; // 4 Hz = 8 Halbschwingungen pro Sekunde
    const sec = d.getSeconds() + Math.floor(d.getMilliseconds() / (1000 / steps)) / steps;
    set("#sh", sec * 6); set("#mh", (d.getMinutes() + sec / 60) * 6); set("#hh", ((d.getHours() % 12) + d.getMinutes() / 60) * 30);
  }
  tick(); setInterval(tick, reduce ? 1000 : 125);
})();

// ---------- Daten laden ----------
const load = f => fetch(f).then(r => r.ok ? r.json() : null).catch(() => null);
// Eingebettete Daten (Offline-Version) haben Vorrang, sonst werden die JSON-Dateien geladen
const DATA = window.WIKITICKS_DATA;
(DATA ? Promise.resolve([DATA.lexikon, DATA.modelle]) : Promise.all([load("lexikon.json"), load("modelle.json")])).then(([lex, mod]) => {
  if (!lex && !mod) { $("#view").innerHTML = '<p class="empty">Die Inhalte konnten nicht geladen werden. Bitte lade die Seite neu.</p>'; return; }
  E = [...(lex || []), ...((mod && mod.modelle) || []).map(m => ({ ...m, c: "Uhrenmodelle" }))];
  ((mod && mod.marken) || []).forEach(m => { BRAND_INFO[m.name] = m; });
  rebuild(); route();
});
</script>
